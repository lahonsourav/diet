<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rapid Bulk Plan</title>
<meta name="description" content="Editable diet plan for rapid, healthy weight gain" />
<meta name="theme-color" content="#16a34a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bulk Plan" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="app-header">
  <div class="app-header__title">
    <span class="app-header__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" overflow="visible">
        <rect x="2" y="9" width="4" height="6" rx="1"/>
        <rect x="18" y="9" width="4" height="6" rx="1"/>
        <line x1="6" y1="12" x2="18" y2="12"/>
        <line x1="8.5" y1="7.5" x2="8.5" y2="16.5"/>
        <line x1="15.5" y1="7.5" x2="15.5" y2="16.5"/>
      </svg>
    </span>
    <div>
      <h1>Rapid Bulk Plan</h1>
      <p class="app-header__subtitle">Diet Plan</p>
    </div>
  </div>
  <div class="app-header__actions">
    <label class="switch edit-toggle">
      <input type="checkbox" id="edit-mode-toggle" />
      <span class="switch__track"><span class="switch__thumb"></span></span>
      <span class="switch__label">Edit</span>
    </label>
    <button id="menu-btn" class="icon-btn" aria-haspopup="true" aria-expanded="false" title="More options">⋮</button>
    <div id="menu-popover" class="menu-popover hidden" role="menu">
      <button id="export-btn" role="menuitem">⬇ Export plan (JSON)</button>
      <button id="import-btn" role="menuitem">⬆ Import plan (JSON)</button>
      <input type="file" id="import-file" accept="application/json" class="hidden" />
      <button id="reset-btn" role="menuitem" class="danger">↺ Reset to default</button>
      <button id="install-btn" role="menuitem" class="hidden">📲 Install app</button>
    </div>
  </div>
</header>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<main class="app-main">

  <section id="tab-diet" class="tab-panel" data-tab-panel="diet">
    <div id="nutrition-card" class="card"></div>
    <div id="meal-reminders-card" class="card"></div>
    <div class="section-heading-row">
      <h2>Full Diet Plan</h2>
      <button id="add-meal-btn" class="add-btn hidden">+ Add meal</button>
    </div>
    <div id="meals-list"></div>
  </section>

  <section id="tab-progress" class="tab-panel hidden" data-tab-panel="progress">
    <div id="stats-card" class="card"></div>
    <h2>Weight Log</h2>
    <div id="weightlog-card" class="card"></div>
    <div id="rules-card" class="card"></div>
  </section>

</main>

<nav class="tab-bar" aria-label="Sections">
  <button class="tab-bar__btn active" data-tab="diet">
    <span>Diet</span>
  </button>
  <button class="tab-bar__btn" data-tab="progress">
    <span>Progress</span>
  </button>
</nav>

<template id="tpl-meal-item">
  <li class="list-row">
    <span class="list-row__text"></span>
    <button class="remove-btn hidden" title="Remove">×</button>
  </li>
</template>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
